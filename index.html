<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Loading...</title>
  <link
    href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=DM+Mono:wght@300;400;500&display=swap"
    rel="stylesheet" />
  <style>
    *,
    *::before,
    *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --cream: #f5f0e8;
      --ink: #1a1814;
      --ink2: #211e19;
      --amber: #c8843a;
      --amber-dim: rgba(200, 132, 58, 0.15);
      --muted: rgba(245, 240, 232, 0.45);
      --border: rgba(245, 240, 232, 0.1);
      --card: rgba(255, 255, 255, 0.03);
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      background: var(--ink);
      color: var(--cream);
      font-family: 'DM Mono', monospace;
      overflow-x: hidden;
    }

    ::-webkit-scrollbar {
      width: 4px;
    }

    ::-webkit-scrollbar-track {
      background: var(--ink);
    }

    ::-webkit-scrollbar-thumb {
      background: var(--amber);
    }

    /* VIDEO BG */
    .video-bg {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
    }

    .video-bg video {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .video-bg::after {
      content: '';
      position: absolute;
      inset: 0;
      z-index: 1;
      background: linear-gradient(to bottom, rgba(26, 24, 20, 0.72) 0%, rgba(26, 24, 20, 0.55) 40%, rgba(26, 24, 20, 0.88) 100%);
    }

    /* NAV */
    nav {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 100;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1.4rem 6vw;
      transition: background 0.4s, backdrop-filter 0.4s;
    }

    nav.scrolled {
      background: rgba(26, 24, 20, 0.85);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
    }

    .nav-logo {
      font-family: 'Playfair Display', serif;
      font-size: 1.1rem;
      color: var(--cream);
      text-decoration: none;
      letter-spacing: 0.02em;
    }

    .nav-logo span {
      color: var(--amber);
    }

    .nav-links {
      display: flex;
      gap: 2rem;
      list-style: none;
    }

    .nav-links a {
      color: var(--muted);
      text-decoration: none;
      font-size: 0.68rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      transition: color 0.2s;
    }

    .nav-links a:hover {
      color: var(--amber);
    }

    .hamburger {
      display: none;
      flex-direction: column;
      gap: 5px;
      cursor: pointer;
      padding: 4px;
      background: none;
      border: none;
    }

    .hamburger span {
      display: block;
      width: 22px;
      height: 1.5px;
      background: var(--cream);
      transition: all 0.3s;
    }

    .hamburger.open span:nth-child(1) {
      transform: translateY(6.5px) rotate(45deg);
    }

    .hamburger.open span:nth-child(2) {
      opacity: 0;
    }

    .hamburger.open span:nth-child(3) {
      transform: translateY(-6.5px) rotate(-45deg);
    }

    .mobile-menu {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 99;
      background: rgba(26, 24, 20, 0.97);
      backdrop-filter: blur(16px);
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 2.5rem;
    }

    .mobile-menu.open {
      display: flex;
    }

    .mobile-menu a {
      color: var(--cream);
      text-decoration: none;
      font-family: 'Playfair Display', serif;
      font-size: 2rem;
      transition: color 0.2s;
    }

    .mobile-menu a:hover {
      color: var(--amber);
    }

    /* SECTIONS */
    section {
      position: relative;
      z-index: 10;
    }

    .section-inner {
      max-width: 1100px;
      margin: 0 auto;
      padding: 7rem 6vw;
    }

    .section-label {
      font-size: 0.65rem;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: var(--amber);
      margin-bottom: 0.8rem;
    }

    .section-title {
      font-family: 'Playfair Display', serif;
      font-size: clamp(2rem, 4vw, 3.2rem);
      font-weight: 700;
      color: var(--cream);
      margin-bottom: 3.5rem;
      line-height: 1.15;
    }

    .section-title span {
      color: var(--amber);
    }

    .divider {
      width: 40px;
      height: 1px;
      background: var(--amber);
      margin: 1rem 0 3.5rem;
    }

    /* HERO */
    #home {
      min-height: 100vh;
      min-height: 100dvh; /* mobile: excludes browser chrome/address bar */
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      padding: 0 6vw 9vh;
      padding-bottom: 9dvh;
    }

    .hero-badges {
      position: absolute;
      top: 5.5rem;
      right: 6vw;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      align-items: flex-end;
    }

    .badge {
      font-size: 0.6rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      padding: 0.3rem 0.75rem;
      border: 1px solid var(--border);
      color: var(--muted);
      background: rgba(26, 24, 20, 0.5);
      backdrop-filter: blur(6px);
    }

    .badge.oss {
      border-color: var(--amber);
      color: var(--amber);
    }

    .hero-tag {
      font-size: 0.7rem;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      color: var(--amber);
      margin-bottom: 1.2rem;
      opacity: 0;
      animation: fadeUp 0.8s ease 0.3s forwards;
    }

    .hero-title {
      font-family: 'Playfair Display', serif;
      font-size: clamp(3rem, 8vw, 7rem);
      line-height: 1.05;
      font-weight: 700;
      color: var(--cream);
      opacity: 0;
      animation: fadeUp 0.9s ease 0.5s forwards;
    }

    .hero-title span {
      color: var(--amber);
    }

    .hero-sub {
      margin-top: 1.6rem;
      font-size: clamp(0.78rem, 1.3vw, 0.95rem);
      color: var(--muted);
      max-width: 480px;
      line-height: 1.9;
      opacity: 0;
      animation: fadeUp 0.9s ease 0.75s forwards;
    }

    .cta-row {
      margin-top: 2.4rem;
      display: flex;
      gap: 1rem;
      flex-wrap: wrap;
      opacity: 0;
      animation: fadeUp 0.9s ease 0.95s forwards;
    }

    .btn {
      display: inline-block;
      padding: 0.7rem 1.8rem;
      border: 1px solid var(--cream);
      color: var(--cream);
      text-decoration: none;
      font-family: 'DM Mono', monospace;
      font-size: 0.72rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      transition: background 0.25s, color 0.25s, border-color 0.25s;
      cursor: pointer;
    }

    .btn:hover {
      background: var(--cream);
      color: var(--ink);
    }

    .btn.filled {
      background: var(--amber);
      border-color: var(--amber);
      color: var(--ink);
    }

    .btn.filled:hover {
      background: #b0722e;
      border-color: #b0722e;
      color: var(--cream);
    }

    .scroll-hint {
      position: fixed;
      bottom: 2.5rem;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.4rem;
      opacity: 0;
      animation: fadeIn 1s ease 1.8s forwards;
    }

    .scroll-hint span {
      font-size: 0.55rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: rgba(245, 240, 232, 0.3);
    }

    .scroll-line {
      width: 1px;
      height: 36px;
      background: linear-gradient(to bottom, var(--amber), transparent);
      animation: scrollPulse 2s ease-in-out infinite;
    }

    /* EXPERIENCE */
    #experience {
      background: var(--ink2);
    }

    .exp-list {
      display: flex;
      flex-direction: column;
    }

    .exp-item {
      display: grid;
      grid-template-columns: 180px 1fr;
      gap: 2rem;
      padding: 2.5rem 0;
      border-bottom: 1px solid var(--border);
    }

    .exp-item:last-child {
      border-bottom: none;
    }

    .exp-meta {
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
    }

    .exp-period {
      font-size: 0.65rem;
      letter-spacing: 0.1em;
      color: var(--amber);
    }

    .exp-company {
      font-size: 0.72rem;
      color: var(--muted);
    }

    .exp-role {
      font-family: 'Playfair Display', serif;
      font-size: 1.25rem;
      color: var(--cream);
      margin-bottom: 0.8rem;
    }

    .exp-desc {
      font-size: 0.75rem;
      line-height: 1.9;
      color: var(--muted);
    }

    .exp-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      margin-top: 1rem;
    }

    .tag-pill {
      font-size: 0.6rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      padding: 0.25rem 0.7rem;
      border: 1px solid var(--border);
      color: var(--muted);
    }

    /* PROJECTS */
    #projects {
      background: var(--ink);
    }

    .projects-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 1.5px;
    }

    .project-card {
      background: var(--card);
      border: 1px solid var(--border);
      padding: 2rem;
      transition: border-color 0.25s, background 0.25s;
      position: relative;
      overflow: hidden;
    }

    .project-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 2px;
      background: var(--amber);
      transform: scaleX(0);
      transform-origin: left;
      transition: transform 0.3s ease;
    }

    .project-card:hover {
      background: rgba(200, 132, 58, 0.04);
      border-color: rgba(200, 132, 58, 0.3);
    }

    .project-card:hover::before {
      transform: scaleX(1);
    }

    .project-num {
      font-size: 0.6rem;
      letter-spacing: 0.2em;
      color: var(--amber);
      margin-bottom: 1rem;
    }

    .project-name {
      font-family: 'Playfair Display', serif;
      font-size: 1.2rem;
      color: var(--cream);
      margin-bottom: 0.8rem;
    }

    .project-desc {
      font-size: 0.72rem;
      line-height: 1.85;
      color: var(--muted);
      margin-bottom: 1.5rem;
    }

    .project-link {
      font-size: 0.62rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--amber);
      text-decoration: none;
      border-bottom: 1px solid rgba(200, 132, 58, 0.3);
      padding-bottom: 2px;
      transition: border-color 0.2s;
    }

    .project-link:hover {
      border-color: var(--amber);
    }

    .oss-block {
      margin-top: 3rem;
      border: 1px solid rgba(200, 132, 58, 0.3);
      padding: 2rem;
      background: var(--amber-dim);
    }

    /* OSS TABS */
    .oss-tabs {
      display: flex;
      gap: 0;
      border-bottom: 1px solid var(--border);
      margin-bottom: 1.5rem;
      flex-wrap: wrap;
    }

    .oss-tab {
      font-family: 'DM Mono', monospace;
      font-size: 0.62rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      padding: 0.6rem 1.2rem;
      border: none;
      border-bottom: 2px solid transparent;
      background: none;
      color: var(--muted);
      cursor: pointer;
      transition: color 0.2s, border-color 0.2s;
      margin-bottom: -1px;
    }

    .oss-tab:hover {
      color: var(--cream);
    }

    .oss-tab.active {
      color: var(--amber);
      border-bottom-color: var(--amber);
    }

    .oss-panel {
      display: none;
    }

    .oss-panel.active {
      display: block;
    }

    .oss-pr-meta {
      font-size: 0.6rem;
      letter-spacing: 0.1em;
      color: var(--muted);
      margin-bottom: 1.2rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 0.5rem;
    }

    .oss-view-all {
      color: var(--amber);
      text-decoration: none;
      font-size: 0.6rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      border-bottom: 1px solid rgba(200,132,58,0.3);
      transition: border-color 0.2s;
    }

    .oss-view-all:hover {
      border-color: var(--amber);
    }

    .oss-prs {
      display: flex;
      flex-direction: column;
      gap: 0;
      max-height: 340px;
      overflow-y: auto;
      scrollbar-width: thin;
      scrollbar-color: var(--amber) transparent;
    }

    .oss-prs::-webkit-scrollbar {
      width: 3px;
    }

    .oss-prs::-webkit-scrollbar-thumb {
      background: var(--amber);
    }

    .oss-pr {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      font-size: 0.72rem;
      color: var(--muted);
      padding: 0.8rem 0;
      border-bottom: 1px solid var(--border);
      gap: 1rem;
      flex-wrap: wrap;
    }

    .oss-pr:last-child {
      border-bottom: none;
    }

    .oss-pr-title {
      color: var(--cream);
      text-decoration: none;
      font-size: 0.72rem;
      flex: 1;
      line-height: 1.5;
      transition: color 0.2s;
    }

    .oss-pr-title:hover {
      color: var(--amber);
    }

    .oss-pr-status {
      font-size: 0.58rem;
      letter-spacing: 0.1em;
      border: 1px solid;
      padding: 0.2rem 0.55rem;
      white-space: nowrap;
      flex-shrink: 0;
      margin-top: 0.15rem;
    }

    .oss-pr-status.merged {
      color: #6fcf97;
      border-color: rgba(111, 207, 151, 0.3);
    }

    .oss-pr-status.open {
      color: #79b8ff;
      border-color: rgba(121, 184, 255, 0.3);
    }

    .oss-pr-status.closed {
      color: rgba(245,240,232,0.35);
      border-color: rgba(245,240,232,0.1);
    }

    .oss-loading {
      font-size: 0.68rem;
      color: var(--muted);
      letter-spacing: 0.1em;
      padding: 1rem 0;
      animation: pulse 1.4s ease-in-out infinite;
    }

    .oss-error {
      font-size: 0.68rem;
      color: var(--muted);
      padding: 0.5rem 0;
    }

    .oss-error a {
      color: var(--amber);
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }


    /* SHARING */
    #sharing {
      background: var(--ink2);
    }

    .sharing-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 1px;
    }

    .share-card {
      border: 1px solid var(--border);
      padding: 2rem;
      background: var(--card);
      transition: border-color 0.25s;
    }

    .share-card:hover {
      border-color: rgba(200, 132, 58, 0.3);
    }

    .share-type {
      font-size: 0.58rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--amber);
      margin-bottom: 0.8rem;
    }

    .share-title {
      font-family: 'Playfair Display', serif;
      font-size: 1.05rem;
      color: var(--cream);
      margin-bottom: 0.7rem;
      line-height: 1.4;
    }

    .share-title a {
      color: inherit;
      text-decoration: none;
      border-bottom: 1px solid rgba(200, 132, 58, 0.3);
    }

    .share-title a:hover {
      border-color: var(--amber);
    }

    .share-desc {
      font-size: 0.7rem;
      line-height: 1.8;
      color: var(--muted);
    }

    /* GFG FULL-WIDTH ARTICLES CARD */
    .share-card-full {
      grid-column: 1 / -1;
      border: 1px solid var(--border);
      padding: 2rem;
      background: var(--card);
      transition: border-color 0.25s;
    }

    .share-card-full:hover {
      border-color: rgba(200, 132, 58, 0.3);
    }

    .share-card-full .share-card-header {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      margin-bottom: 1.5rem;
      flex-wrap: wrap;
      gap: 0.5rem;
    }

    .share-card-full .share-type {
      margin-bottom: 0;
    }

    .gfg-article-count {
      font-size: 0.58rem;
      letter-spacing: 0.15em;
      color: var(--muted);
      text-transform: uppercase;
    }

    .gfg-articles-scroll {
      max-height: 320px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 0;
      scrollbar-width: thin;
      scrollbar-color: var(--amber) transparent;
    }

    .gfg-articles-scroll::-webkit-scrollbar {
      width: 3px;
    }

    .gfg-articles-scroll::-webkit-scrollbar-thumb {
      background: var(--amber);
    }

    .gfg-article-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.75rem 0;
      border-bottom: 1px solid var(--border);
      gap: 1.5rem;
      transition: background 0.15s;
    }

    .gfg-article-item:last-child {
      border-bottom: none;
    }

    .gfg-article-item:hover {
      background: rgba(200, 132, 58, 0.04);
    }

    .gfg-article-title {
      font-size: 0.72rem;
      color: var(--cream);
      text-decoration: none;
      line-height: 1.5;
      flex: 1;
      transition: color 0.2s;
    }

    .gfg-article-title:hover {
      color: var(--amber);
    }

    .gfg-article-date {
      font-size: 0.58rem;
      letter-spacing: 0.08em;
      color: var(--muted);
      white-space: nowrap;
      flex-shrink: 0;
    }

    /* EDUCATION */
    #education {
      background: var(--ink);
    }

    .edu-list {
      display: flex;
      flex-direction: column;
      gap: 2rem;
    }

    .edu-item {
      display: grid;
      grid-template-columns: 180px 1fr;
      gap: 2rem;
      padding-bottom: 2rem;
      border-bottom: 1px solid var(--border);
    }

    .edu-item:last-child {
      border-bottom: none;
    }

    .edu-year {
      font-size: 0.65rem;
      letter-spacing: 0.1em;
      color: var(--amber);
      padding-top: 0.3rem;
    }

    .edu-degree {
      font-family: 'Playfair Display', serif;
      font-size: 1.2rem;
      color: var(--cream);
      margin-bottom: 0.3rem;
    }

    .edu-institution {
      font-size: 0.72rem;
      color: var(--muted);
      margin-bottom: 0.5rem;
    }

    .edu-detail {
      font-size: 0.7rem;
      color: var(--muted);
      line-height: 1.7;
    }

    /* SKILLS */
    #skills {
      background: var(--ink2);
    }

    .skills-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 1.5rem;
    }

    .skill-group {
      border: 1px solid var(--border);
      padding: 1.8rem;
      background: var(--card);
    }

    .skill-group-title {
      font-size: 0.62rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--amber);
      margin-bottom: 1.2rem;
    }

    .skill-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
    }

    .skill-tag {
      font-size: 0.65rem;
      letter-spacing: 0.08em;
      padding: 0.3rem 0.75rem;
      border: 1px solid var(--border);
      color: var(--cream);
      background: rgba(255, 255, 255, 0.02);
      transition: border-color 0.2s, color 0.2s;
    }

    .skill-tag:hover {
      border-color: var(--amber);
      color: var(--amber);
    }

    .skill-tag.primary {
      border-color: rgba(200, 132, 58, 0.5);
      color: var(--amber);
    }

    /* CONTACT */
    #contact {
      background: var(--ink);
    }

    .contact-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 5rem;
      align-items: start;
    }

    .contact-left p {
      font-size: 0.78rem;
      line-height: 2;
      color: var(--muted);
      margin-bottom: 2.5rem;
    }

    .contact-links {
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .contact-link {
      display: flex;
      align-items: center;
      gap: 1rem;
      text-decoration: none;
      color: var(--muted);
      font-size: 0.72rem;
      transition: color 0.2s;
      padding-bottom: 1rem;
      border-bottom: 1px solid var(--border);
    }

    .contact-link:hover {
      color: var(--amber);
    }

    .contact-link-label {
      font-size: 0.55rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--amber);
      min-width: 60px;
    }

    .contact-form {
      display: flex;
      flex-direction: column;
      gap: 1.2rem;
    }

    .form-field {
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
    }

    .form-field label {
      font-size: 0.6rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .form-field input,
    .form-field textarea {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--border);
      color: var(--cream);
      font-family: 'DM Mono', monospace;
      font-size: 0.75rem;
      padding: 0.8rem 1rem;
      outline: none;
      resize: none;
      transition: border-color 0.2s;
    }

    .form-field input:focus,
    .form-field textarea:focus {
      border-color: var(--amber);
    }

    .form-field textarea {
      height: 120px;
    }

    /* FOOTER */
    footer {
      position: relative;
      z-index: 10;
      border-top: 1px solid var(--border);
      padding: 2rem 6vw;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 1rem;
      background: var(--ink2);
    }

    footer p {
      font-size: 0.62rem;
      letter-spacing: 0.1em;
      color: var(--muted);
    }

    footer span {
      color: var(--amber);
    }

    /* ANIMATIONS */
    @keyframes fadeUp {
      from {
        opacity: 0;
        transform: translateY(22px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
      }

      to {
        opacity: 1;
      }
    }

    @keyframes scrollPulse {

      0%,
      100% {
        transform: scaleY(1);
        opacity: 1;
      }

      50% {
        transform: scaleY(0.6);
        opacity: 0.4;
      }
    }

    .reveal {
      opacity: 0;
      transform: translateY(28px);
      transition: opacity 0.7s ease, transform 0.7s ease;
    }

    .reveal.visible {
      opacity: 1;
      transform: translateY(0);
    }

    /* MOBILE */
    @media (max-width: 768px) {
      .nav-links {
        display: none;
      }

      .hamburger {
        display: flex;
      }

      .hero-badges {
        display: none;
      }

      #home {
        padding: 0 6vw 10vh;
      }

      .exp-item,
      .edu-item {
        grid-template-columns: 1fr;
        gap: 0.5rem;
      }

      .contact-grid {
        grid-template-columns: 1fr;
        gap: 3rem;
      }

      .section-inner {
        padding: 5rem 6vw;
      }

      .projects-grid,
      .sharing-grid,
      .skills-grid {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 480px) {
      .hero-title {
        font-size: clamp(2.2rem, 11vw, 3.5rem);
      }

      .cta-row {
        flex-direction: column;
      }

      .btn {
        text-align: center;
      }
    }
  </style>
</head>

<body>

  <div class="video-bg">
    <video id="v1" autoplay muted playsinline></video>
    <video id="v2" muted playsinline style="opacity:0;"></video>
  </div>

  <nav id="nav"></nav>
  <div class="mobile-menu" id="mobileMenu"></div>

  <section id="home">
    <div class="hero-badges" id="heroBadges"></div>
    <p class="hero-tag" id="heroTag"></p>
    <h1 class="hero-title" id="heroTitle"></h1>
    <p class="hero-sub" id="heroBio"></p>
    <div class="cta-row" id="ctaRow"></div>
  </section>

  <div class="scroll-hint">
    <div class="scroll-line"></div>
    <span>scroll</span>
  </div>

  <section id="experience">
    <div class="section-inner">
      <p class="section-label reveal">Work History</p>
      <h2 class="section-title reveal">Experience</h2>
      <div class="divider reveal"></div>
      <div class="exp-list" id="expList"></div>
    </div>
  </section>

  <section id="projects">
    <div class="section-inner">
      <p class="section-label reveal">What I've Built</p>
      <h2 class="section-title reveal">Projects</h2>
      <div class="divider reveal"></div>
      <div class="projects-grid" id="projectsGrid"></div>
      <div class="oss-block reveal" id="ossBlock"></div>
    </div>
  </section>

  <section id="sharing">
    <div class="section-inner">
      <p class="section-label reveal">Knowledge & Community</p>
      <h2 class="section-title reveal">Sharing</h2>
      <div class="divider reveal"></div>
      <div class="sharing-grid" id="sharingGrid"></div>
    </div>
  </section>

  <section id="education">
    <div class="section-inner">
      <p class="section-label reveal">Academic Background</p>
      <h2 class="section-title reveal">Education</h2>
      <div class="divider reveal"></div>
      <div class="edu-list" id="eduList"></div>
    </div>
  </section>

  <section id="skills">
    <div class="section-inner">
      <p class="section-label reveal">Technical Stack</p>
      <h2 class="section-title reveal">Skills <span>&</span> Stack</h2>
      <div class="divider reveal"></div>
      <div class="skills-grid" id="skillsGrid"></div>
    </div>
  </section>

  <section id="contact">
    <div class="section-inner">
      <p class="section-label reveal">Get In Touch</p>
      <h2 class="section-title reveal">Contact</h2>
      <div class="divider reveal"></div>
      <div class="contact-grid">
        <div class="contact-left reveal" id="contactLeft"></div>
        <div class="reveal">
          <form class="contact-form" onsubmit="handleSubmit(event)">
            <div class="form-field"><label>Name</label><input type="text" placeholder="Your name" required /></div>
            <div class="form-field"><label>Email</label><input type="email" placeholder="your@email.com" required />
            </div>
            <div class="form-field"><label>Message</label><textarea
                placeholder="Tell me about the role or project..."></textarea></div>
            <button type="submit" class="btn filled">Send Message →</button>
          </form>
        </div>
      </div>
    </div>
  </section>

  <footer id="footer"></footer>

  <script>
    const NAV_SECTIONS = ['experience', 'projects', 'sharing', 'education', 'skills', 'contact'];

    Promise.all([
      fetch('data.json').then(r => r.json()),
      fetch('assets/Data/gfg.json').then(r => r.json()).catch(() => ({}))
    ]).then(([d, gfg]) => {
      document.title = `${d.meta.name} — ${d.meta.title}`;
      renderNav(d.meta);
      renderHero(d.meta, d.hero);
      renderExperience(d.experience);
      renderProjects(d.projects, d.oss);
      renderSharing(d.sharing, gfg);
      renderEducation(d.education);
      renderSkills(d.skills);
      renderContact(d.contact);
      renderFooter(d.meta);
      initVideo(d.meta.video);
      initNav();
      initMobileMenu();
      setTimeout(initScrollReveal, 100);
    })
      .catch(err => console.error('Could not load data:', err));

    function renderNav(m) {
      document.getElementById('nav').innerHTML = `
      <a href="#home" class="nav-logo">${m.name.split(' ')[0]}<span>.</span></a>
      <ul class="nav-links">${NAV_SECTIONS.map(s => `<li><a href="#${s}">${s}</a></li>`).join('')}</ul>
      <button class="hamburger" id="hamburger"><span></span><span></span><span></span></button>`;
      document.getElementById('mobileMenu').innerHTML =
        NAV_SECTIONS.map(s => `<a href="#${s}" class="mobile-link">${s[0].toUpperCase() + s.slice(1)}</a>`).join('');
    }

    function renderHero(m, h) {
      document.getElementById('heroTag').textContent = m.tag;
      document.getElementById('heroBio').textContent = m.bio;
      document.getElementById('heroTitle').innerHTML = `${m.name.split(' ')[0]}<br/><span>${m.tagline}</span><br/>${m.tagline2}`;
      document.getElementById('heroBadges').innerHTML = h.badges.map(b => `<div class="badge${b.highlight ? ' oss' : ''}">${b.text}</div>`).join('');
      document.getElementById('ctaRow').innerHTML = h.cta.map(c => `<a href="${c.url}" class="btn ${c.style === 'filled' ? 'filled' : ''}" ${c.newTab ? 'target="_blank"' : ''}>${c.label}</a>`).join('');
    }

    function renderExperience(items) {
      document.getElementById('expList').innerHTML = items.map(e => `
      <div class="exp-item reveal">
        <div class="exp-meta">
          <span class="exp-period">${e.period}</span>
          <span class="exp-company">${e.company}</span>
        </div>
        <div>
          <p class="exp-role">${e.role}</p>
          <p class="exp-desc">${e.description}</p>
          <div class="exp-tags">${e.tags.map(t => `<span class="tag-pill">${t}</span>`).join('')}</div>
        </div>
      </div>`).join('');
    }

    function renderProjects(projects, oss) {
      // Render project cards
      document.getElementById('projectsGrid').innerHTML = projects.map(p => `
      <div class="project-card reveal">
        <p class="project-num">${p.num}</p>
        <p class="project-name">${p.name}</p>
        <p class="project-desc">${p.description}</p>
        <a href="${p.url}" class="project-link" ${p.url !== '#' ? 'target="_blank"' : ''}>${p.linkLabel}</a>
      </div>`).join('');

      // Render OSS block with tabs + live GitHub API
      renderOss(oss);
    }

    async function renderOss(oss) {
      const ossBlock = document.getElementById('ossBlock');
      const sources = oss.sources || [];
      if (!sources.length) { ossBlock.style.display = 'none'; return; }

      // Build skeleton: tabs + panels
      ossBlock.innerHTML = `
        ${oss.label ? `<p class="oss-block-title">${oss.label}</p>` : ''}
        <div class="oss-tabs">
          ${sources.map((s, i) => `<button class="oss-tab${i === 0 ? ' active' : ''}" data-idx="${i}">${s.label}</button>`).join('')}
        </div>
        ${sources.map((s, i) => `
          <div class="oss-panel${i === 0 ? ' active' : ''}" data-idx="${i}">
            <p class="oss-loading">Fetching live PR data from GitHub…</p>
          </div>`).join('')}`;

      // Tab click switching
      ossBlock.querySelectorAll('.oss-tab').forEach(tab => {
        tab.addEventListener('click', () => {
          ossBlock.querySelectorAll('.oss-tab').forEach(t => t.classList.remove('active'));
          ossBlock.querySelectorAll('.oss-panel').forEach(p => p.classList.remove('active'));
          tab.classList.add('active');
          ossBlock.querySelector(`.oss-panel[data-idx="${tab.dataset.idx}"]`).classList.add('active');
        });
      });

      // Fetch each source in parallel
      sources.forEach(async (source, i) => {
        const panel = ossBlock.querySelector(`.oss-panel[data-idx="${i}"]`);
        try {
          // Parse: https://github.com/{owner}/{repo}/pulls/{author}
          const match = source.url.match(/github\.com\/([^\/]+)\/([^\/]+)\/pulls\/([^\/?#]+)/);
          if (!match) throw new Error('Invalid GitHub URL format');
          const [, owner, repo, author] = match;

          const apiUrl = `https://api.github.com/search/issues?q=is:pr+repo:${owner}/${repo}+author:${author}&per_page=50&sort=created&order=desc`;
          const res = await fetch(apiUrl, { headers: { Accept: 'application/vnd.github+json' } });
          if (!res.ok) throw new Error(`GitHub API: ${res.status}`);
          const data = await res.json();

          if (!data.items || data.items.length === 0) {
            panel.innerHTML = `<p class="oss-error">No PRs found. <a href="${source.url}" target="_blank">View on GitHub →</a></p>`;
            return;
          }

          // Show only merged + open PRs, skip closed-without-merge
          const visiblePRs = data.items.filter(pr => !!pr.pull_request?.merged_at || pr.state === 'open');

          const prsHtml = visiblePRs.map(pr => {
            const isMerged = !!pr.pull_request?.merged_at;
            const state    = isMerged ? 'merged' : 'open';
            const badge    = isMerged ? '✓ Merged' : '● Open';
            return `
              <div class="oss-pr">
                <a href="${pr.html_url}" target="_blank" class="oss-pr-title">#${pr.number} — ${pr.title}</a>
                <span class="oss-pr-status ${state}">${badge}</span>
              </div>`;
          }).join('');

          const mergedCount = visiblePRs.filter(pr => !!pr.pull_request?.merged_at).length;
          const openCount   = visiblePRs.filter(pr => pr.state === 'open').length;
          const metaLabel   = `${visiblePRs.length} PR${visiblePRs.length !== 1 ? 's' : ''} &nbsp;·&nbsp; <span style="color:#6fcf97">${mergedCount} merged</span> &nbsp;·&nbsp; <span style="color:#79b8ff">${openCount} open</span> &nbsp;·&nbsp; ${owner}/${repo}`;

          panel.innerHTML = `
            <div class="oss-pr-meta">
              <span>${metaLabel}</span>
              <a href="${source.url}" target="_blank" class="oss-view-all">View all on GitHub →</a>
            </div>
            <div class="oss-prs">${prsHtml}</div>`;

        } catch (err) {
          panel.innerHTML = `<p class="oss-error">Could not load live PR data (GitHub API rate limit may apply). <a href="${source.url}" target="_blank">View on GitHub →</a></p>`;
        }
      });
    }

    function renderSharing(items, gfg) {
      const gfgArticles = Object.values(gfg);

      // Render normal cards
      const normalCards = items.map(s => `
        <div class="share-card reveal">
          <p class="share-type">${s.type}</p>
          <p class="share-title">${s.url ? `<a href="${s.url}" target="_blank">${s.title}</a>` : s.title}</p>
          <p class="share-desc">${s.description}</p>
        </div>`).join('');

      // Render one full-width scrollable GFG articles card
      const gfgCard = `
        <div class="share-card-full reveal">
          <div class="share-card-header">
            <p class="share-type">GeeksForGeeks · Articles</p>
            <span class="gfg-article-count">${gfgArticles.length} Published Articles</span>
          </div>
          <div class="gfg-articles-scroll">
            ${gfgArticles.map(a => `
              <div class="gfg-article-item">
                <a href="${a.url}" target="_blank" class="gfg-article-title">${a.Title}</a>
                <span class="gfg-article-date">${(a.date || '').replace('Last Updated: ', '')}</span>
              </div>`).join('')}
          </div>
        </div>`;

      document.getElementById('sharingGrid').innerHTML = normalCards + gfgCard;
    }

    function renderEducation(items) {
      document.getElementById('eduList').innerHTML = items.map(e => `
      <div class="edu-item reveal">
        <div class="edu-year">${e.period}</div>
        <div>
          <p class="edu-degree">${e.degree}</p>
          <p class="edu-institution">${e.institution}</p>
          <p class="edu-detail">${e.detail}</p>
        </div>
      </div>`).join('');
    }

    function renderSkills(groups) {
      document.getElementById('skillsGrid').innerHTML = groups.map(g => `
      <div class="skill-group reveal">
        <p class="skill-group-title">${g.group}</p>
        <div class="skill-tags">${g.items.map(i => `<span class="skill-tag${i.primary ? ' primary' : ''}">${i.name}</span>`).join('')}</div>
      </div>`).join('');
    }

    function renderContact(c) {
      document.getElementById('contactLeft').innerHTML = `
      <p>${c.blurb}</p>
      <div class="contact-links">${c.links.map(l => `
        <a href="${l.url}" class="contact-link" ${l.newTab ? 'target="_blank"' : ''}>
          <span class="contact-link-label">${l.label}</span>${l.display}
        </a>`).join('')}
      </div>`;
    }

    function renderFooter(m) {
      document.getElementById('footer').innerHTML = `
      <p>© ${new Date().getFullYear()} <span>${m.name}</span>. All rights reserved.</p>
      <p>Built with <span>♥</span> · Open to remote opportunities worldwide</p>`;
    }

    function initVideo(src) {
      const FADE = 2.0, v1 = document.getElementById('v1'), v2 = document.getElementById('v2');
      v1.src = src; v2.src = src;
      let active = v1, standby = v2;
      active.play();
      [v1, v2].forEach(v => v.style.transition = `opacity ${FADE}s ease`);
      setInterval(() => {
        const rem = active.duration - active.currentTime;
        if (!isNaN(rem) && rem <= FADE && standby.paused) {
          standby.currentTime = 0; standby.play();
          active.style.opacity = '0'; standby.style.opacity = '1';
          setTimeout(() => { active.pause(); active.currentTime = 0;[active, standby] = [standby, active]; }, FADE * 1000);
        }
      }, 1000 / 60);
    }

    function initNav() {
      const nav = document.getElementById('nav');
      window.addEventListener('scroll', () => nav.classList.toggle('scrolled', window.scrollY > 60));
    }

    function initMobileMenu() {
      document.addEventListener('click', e => {
        const btn = document.getElementById('hamburger');
        const mob = document.getElementById('mobileMenu');
        if (!btn) return;
        if (btn.contains(e.target)) { btn.classList.toggle('open'); mob.classList.toggle('open'); }
        else if (e.target.classList.contains('mobile-link')) { btn.classList.remove('open'); mob.classList.remove('open'); }
      });
    }

    function initScrollReveal() {
      const obs = new IntersectionObserver(entries => {
        entries.forEach(e => { if (e.isIntersecting) e.target.classList.add('visible'); });
      }, { threshold: 0.1 });
      document.querySelectorAll('.reveal').forEach(el => obs.observe(el));
    }

    function handleSubmit(e) {
      e.preventDefault();
      const btn = e.target.querySelector('button');
      btn.textContent = 'Sent ✓'; btn.style.background = '#6fcf97'; btn.style.borderColor = '#6fcf97';
      setTimeout(() => { btn.textContent = 'Send Message →'; btn.style.background = ''; btn.style.borderColor = ''; }, 3000);
    }
  </script>
</body>

</html>
